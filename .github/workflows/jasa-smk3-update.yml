name: Jasa SMK3 Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jasa-smk3-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Random delay (0-12h)
        run: |
          DELAY=$((RANDOM % 300))
          echo "Sleeping $DELAY seconds (TEST MODE)"
          sleep $DELAY
      - name: Run if interval elapsed
        env:
          WORKFLOW_TYPE: jasa-smk3-update
          INTERVAL_HOURS: 24
        run: node scripts/run-if-interval-elapsed.mjs
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasa-smk3-update-result
          path: automation-output/
          if-no-files-found: ignore