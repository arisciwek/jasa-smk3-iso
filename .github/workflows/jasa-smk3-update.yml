name: Jasa SMK3 Update

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jasa-smk3-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run if interval elapsed
        env:
          WORKFLOW_TYPE: jasa-smk3-update
          INTERVAL_HOURS: 24
          TRIGGER_TYPE: ${{ github.event_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://freellmapi.ciptamasjaya.co.id/v1
          AI_MODEL: auto
        run: node scripts/run-if-interval-elapsed.mjs
      - name: Commit and push
        if: always()
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          
          # Stage relevant files
          git add src/data/jasa-smk3/ automation-state/last-run.json
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          
          # Get the updated city name and topic from JSON
          latest_city=$(find src/data/jasa-smk3 -name "*.json" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          
          if [ -n "$latest_city" ]; then
            # Extract city name from JSON
            city_slug=$(basename "$latest_city" .json)
            city_name=$(echo "$city_slug" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
            
            # Extract topic from JSON (lastUpdatedTopic or last paragraph topic)
            topic=$(grep -o '"lastUpdatedTopic": *"[^"]*"' "$latest_city" | sed 's/"lastUpdatedTopic": *"//' | sed 's/"//')
            if [ -z "$topic" ]; then
              topic=$(grep -o '"topic": *"[^"]*"' "$latest_city" | tail -1 | sed 's/"topic": *"//' | sed 's/"//')
            fi
            
            if [ -n "$city_name" ] && [ -n "$topic" ]; then
              git commit -m "update: jasa SMK3: $city_name: $topic"
              git push
              exit 0
            elif [ -n "$city_name" ]; then
              git commit -m "update: jasa SMK3: $city_name"
              git push
              exit 0
            fi
          fi
          
          # Fallback if we can't get details
          git commit -m "update: jasa SMK3"
          git push
