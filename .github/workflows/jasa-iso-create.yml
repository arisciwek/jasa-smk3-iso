name: Jasa ISO Create

on:
  schedule:
    - cron: '25 1-13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run if interval elapsed
        env:
          WORKFLOW_TYPE: jasa-iso-create
          INTERVAL_HOURS: 48
          TRIGGER_TYPE: ${{ github.event_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://freellmapi.ciptamasjaya.co.id/v1
          AI_MODEL: auto
        run: node scripts/run-if-interval-elapsed.mjs
      - name: Commit and push
        if: always()
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          push_retry() {
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                return 0
              fi
              echo "push attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "push failed after 5 attempts"
            return 1
          }
          
          # Stage relevant files
          git add src/data/jasa-iso/ automation-state/last-run.json
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          
          # Get the created city name from automation-output or src
          latest_city=$(find src/data/jasa-iso -name "*.json" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          
          if [ -n "$latest_city" ]; then
            # Extract city name from JSON
            city_slug=$(basename "$latest_city" .json)
            city_name=$(echo "$city_slug" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
            if [ -n "$city_name" ]; then
              git commit -m "create: jasa ISO: $city_name"
              push_retry
              exit 0
            fi
          fi
          
          # Fallback if we can't get city name
          git commit -m "create: jasa ISO"
          push_retry
