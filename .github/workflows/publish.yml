name: Publish

on:
  workflow_run:
    workflows:
      - "Article Create"
      - "Article Update"
      - "Jasa SMK3 Create"
      - "Jasa SMK3 Update"
      - "Jasa ISO Create"
      - "Jasa ISO Update"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: automation-input
          pattern: '*-result'
          merge-multiple: true
      - name: Merge results
        run: |
          cp -a automation-input/*/. . 2>/dev/null || true
          rm -rf automation-input
      - run: npm run build
      - name: Determine commit message
        id: commit_msg
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          
          # Stage all relevant files
          git add content-plan.json src/content/articles src/data/jasa-smk3 src/data/jasa-iso
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Get list of changed files
          changed_files=$(git diff --cached --name-only)
          
          # Build commit message parts
          creates=()
          updates=()
          
          # Check article creates
          for file in $changed_files; do
            if [[ $file == src/content/articles/*.md ]]; then
              slug=$(basename "$file" .md)
              # Check if it's a new file (create) or modified (update)
              if git diff --cached --name-status | grep -q "^A.*$file"; then
                # New article - get title from frontmatter
                title=$(grep -m1 '^title:' "$file" | sed 's/^title: *//' | sed 's/^"//' | sed 's/"$//')
                creates+=("artikel: $title")
              else
                # Updated article - get title from frontmatter
                title=$(grep -m1 '^title:' "$file" | sed 's/^title: *//' | sed 's/^"//' | sed 's/"$//')
                updates+=("artikel: $title")
              fi
            fi
          done
          
          # Check jasa-smk3 creates/updates
          for file in $changed_files; do
            if [[ $file == src/data/jasa-smk3/*.json ]]; then
              city=$(basename "$file" .json)
              city_name=$(echo "$city" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
              if git diff --cached --name-status | grep -q "^A.*$file"; then
                creates+=("jasa SMK3: $city_name")
              else
                # Get updated topic from JSON (lastUpdatedTopic or last paragraph topic)
                topic=$(grep -o '"lastUpdatedTopic": *"[^"]*"' "$file" | sed 's/"lastUpdatedTopic": *"//' | sed 's/"//')
                if [ -z "$topic" ]; then
                  topic=$(grep -o '"topic": *"[^"]*"' "$file" | tail -1 | sed 's/"topic": *"//' | sed 's/"//')
                fi
                updates+=("jasa SMK3 $city_name: $topic")
              fi
            fi
          done
          
          # Check jasa-iso creates/updates
          for file in $changed_files; do
            if [[ $file == src/data/jasa-iso/*.json ]]; then
              city=$(basename "$file" .json)
              city_name=$(echo "$city" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)} 1')
              if git diff --cached --name-status | grep -q "^A.*$file"; then
                creates+=("jasa ISO: $city_name")
              else
                topic=$(grep -o '"lastUpdatedTopic": *"[^"]*"' "$file" | sed 's/"lastUpdatedTopic": *"//' | sed 's/"//')
                if [ -z "$topic" ]; then
                  topic=$(grep -o '"topic": *"[^"]*"' "$file" | tail -1 | sed 's/"topic": *"//' | sed 's/"//')
                fi
                updates+=("jasa ISO $city_name: $topic")
              fi
            fi
          done
          
          # Build commit message
          msg_parts=()
          if [ ${#creates[@]} -gt 0 ]; then
            msg_parts+=("create: $(IFS=', '; echo "${creates[*]}")")
          fi
          if [ ${#updates[@]} -gt 0 ]; then
            msg_parts+=("update: $(IFS=', '; echo "${updates[*]}")")
          fi
          
          commit_msg=$(IFS=$'\n'; echo "${msg_parts[*]}")
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$commit_msg" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Commit message: $commit_msg"
      - name: Commit and push
        if: steps.commit_msg.outputs.has_changes == 'true'
        run: |
          git commit -m "${{ steps.commit_msg.outputs.commit_msg }}"
          git push
      - name: No changes
        if: steps.commit_msg.outputs.has_changes == 'false'
        run: echo "Tidak ada perubahan untuk di-commit."