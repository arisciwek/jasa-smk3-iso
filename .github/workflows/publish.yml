name: Publish

on:
  workflow_run:
    workflows:
      - "Article Create"
      - "Article Update"
      - "Jasa SMK3 Create"
      - "Jasa SMK3 Update"
      - "Jasa ISO Create"
      - "Jasa ISO Update"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: automation-input
          pattern: *-result
          merge-multiple: true
      - name: Merge results
        run: |
          cp -a automation-input/*/. . 2>/dev/null || true
          rm -rf automation-input
      - run: npm run build
      - name: Commit and push
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          git add content-plan.json src/content/articles src/data/jasa-smk3 src/data/jasa-iso
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "content: daily article and city update"
          git push