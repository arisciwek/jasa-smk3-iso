name: City content daily

on:
  schedule:
    # Script memilih satu jam secara deterministik setiap hari pada 08.00–20.00 WIB.
    - cron: '3 1-13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: city-content-daily
  cancel-in-progress: false

jobs:
  update-city:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decide schedule
        id: decide
        run: node scripts/decide-city-content.mjs

      - name: Skip this schedule slot
        if: steps.decide.outputs.tasks == '0'
        run: echo "Tidak ada update pada slot ini (${{ steps.decide.outputs.reason }})."

      - name: Generate one city paragraph
        if: steps.decide.outputs.tasks == '1'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: node scripts/generate-city-content.mjs

      - name: Build verification
        if: steps.decide.outputs.tasks == '1'
        run: npm run build

      - name: Commit and push
        if: steps.decide.outputs.tasks == '1'
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          git add src/data/city-content
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "content: update city paragraph"
          git push
