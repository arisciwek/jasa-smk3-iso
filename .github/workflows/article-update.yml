name: Article Update

on:
  schedule:
    - cron: '0 1-13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run if interval elapsed
        env:
          WORKFLOW_TYPE: article-update
          INTERVAL_HOURS: 24
          TRIGGER_TYPE: ${{ github.event_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://freellmapi.ciptamasjaya.co.id/v1
          AI_MODEL: auto
        run: node scripts/run-if-interval-elapsed.mjs
      - name: Commit and push
        if: always()
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          push_retry() {
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                return 0
              fi
              echo "push attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "push failed after 5 attempts"
            return 1
          }
          
          # Stage relevant files
          git add src/content/articles/ content-plan.json automation-state/last-run.json src/data/service-lastmod.json
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          
          # Get the created article title from automation-output or src
          # Since generator creates the file, we can check src/content/articles/ for new files
          # But easier: the generator writes to automation-output/src/content/articles/
          # Actually, the generator already ran and updated the files, so we can just get the title from the generated file
          
          # Find the most recently created/modified article file in src/content/articles/
          latest_article=$(find src/content/articles -name "*.md" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          
          if [ -n "$latest_article" ]; then
            # Extract title from frontmatter
            title=$(grep -m1 '^title:' "$latest_article" | sed 's/^title: *//' | sed 's/^"//' | sed 's/"$//')
            if [ -n "$title" ]; then
              git commit -m "update: artikel: $title"
              push_retry
              exit 0
            fi
          fi
          
          # Fallback if we can't get title
          git commit -m "update: artikel"
          push_retry
