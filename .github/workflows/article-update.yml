name: Article Update

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: article-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run if interval elapsed
        env:
          WORKFLOW_TYPE: article-update
          INTERVAL_HOURS: 24
          TRIGGER_TYPE: ${{ github.event_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ variables.AI_BASE_URL }}
          AI_MODEL: ${{ variables.AI_MODEL }}
        run: node scripts/run-if-interval-elapsed.mjs
      - name: Commit and push
        if: always()
        run: |
          git config user.name "smk3-iso-content-bot"
          git config user.email "smk3-iso-content-bot@users.noreply.github.com"
          
          # Stage relevant files
          git add src/content/articles/ content-plan.json automation-state/last-run.json
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          
          # Find the most recently modified article file (likely the one we updated)
          latest_article=$(find src/content/articles -name "*.md" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          
          if [ -n "$latest_article" ]; then
            # Extract title from frontmatter
            title=$(grep -m1 '^title:' "$latest_article" | sed 's/^title: *//' | sed 's/^"//' | sed 's/"$//')
            if [ -n "$title" ]; then
              git commit -m "update: artikel: $title"
              git push
              exit 0
            fi
          fi
          
          # Fallback if we can't get title
          git commit -m "update: artikel"
          git push
